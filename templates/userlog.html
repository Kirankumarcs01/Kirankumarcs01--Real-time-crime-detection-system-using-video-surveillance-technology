<!DOCTYPE html>
<html lang="en">
<head>
  <title>Project Title</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/he/1.2.0/he.js" integrity="sha512-o4gKX6jcK0rdciOZ9X8COYkV9gviTJAbYEVW8aC3OgIRuaKDmcT9/OFXBVzHSSOxiTjsTktqrUvCUrHkQHSn9Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    body {
      background: linear-gradient(45deg, #9b59b6, #ff3366); /* Gradient from deep purple to bright pink */
  font-family: Arial, sans-serif;
      background-size: cover;
      
    }

    .form-container {
      width: 100%;
      padding: 30px;
      background-color: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      color: white;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .form-container label {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    .form-container input[type="file"] {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      font-size: 1em;
    }

    .form-container button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }

    .form-container button:hover {
      background-color: #218838;
    }

    .navbar {
      margin-bottom: 0;
    }

    .navbar-brand {
      font-size: 1.8em;
      color: white !important;
    }

    .navbar-inverse .navbar-nav>li>a {
      color: white;
    }

    .navbar-inverse .navbar-nav>li>a:hover {
      background-color: #28a745;
    }

    .form-wrapper {
      display: flex;
      justify-content: space-between;
      flex-wrap: nowrap;
      margin: 20px auto;
      width: 80%;
    }

    .form-wrapper .form-container {
      width: 32%;  /* Adjust width so the forms fit side by side */
      margin: 0 10px;
    }

    .btn-success {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      font-size: 1.2em;
    }

    /* Ensure responsiveness on mobile */
    @media (max-width: 768px) {
      .form-wrapper {
        flex-direction: column;
        align-items: center;
      }

      .form-wrapper .form-container {
        width: 80%;
      }
    }
    
    /* Owl Eye */
    .owl {
      position: relative;
      width: 200px;
      height: 200px;
      background: rgba(214, 157, 88, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      margin: 30px auto; /* Centers the owl below the boxes */
    }

    .eye {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .eye.left {
      left: 40px;
    }

    .eye.right {
      right: 40px;
    }

    .pupil {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #000;
      border-radius: 50%;
      transition: all 0.1s ease-out;
    }

    /* Center the owl and form-wrapper */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    /* Visibility and active classes for the forms */
    #home, #form1, #form2, #form3, #form4{
      display: none;
      width: 50%;
      margin: auto;
      padding: 25px 50px;
      background-color: rgba(0, 0, 0, 0.50);
      margin-top: 50px !important;
      color: white;
    }
    #home.active, #form1.active, #form2.active, #form3.active, #form4.active{
        display: block;
    }

  </style>
</head>
<body>

<nav class="navbar navbar-inverse">
  <div class="container-fluid">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="/">Crime detection</a>
    </div>
    <div class="collapse navbar-collapse" id="myNavbar">
      <ul class="nav navbar-nav">
      </ul>
      <ul class="nav navbar-nav navbar-right">
        <li><a href="/">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="form-wrapper">
  <div class="form-container">
    <h2>Upload Files for Weapons Detection</h2>
    <form action="/Live1" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" id="file" required>
      <button type="submit">Upload</button>
    </form>
  </div>

  <div class="form-container">
    <h2>Upload Files for Accident Detection</h2>
    <form action="/Live2" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" id="file" required>
      <button type="submit">Upload</button>
    </form>
  </div>

  <div class="form-container">
    <h2>Upload Files for Explosion Detection</h2>
    <form action="/Live3" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" id="file" required>
      <button type="submit">Upload</button>
    </form>
  </div>
</div>

<!-- Owl Eye Idol -->
<div class="owl">
  <div class="eye left">
    <div class="pupil"></div>
  </div>
  <div class="eye right">
    <div class="pupil"></div>
  </div>
</div>

<script>
  document.addEventListener('mousemove', (event) => {
    const eyes = document.querySelectorAll('.eye');
    eyes.forEach((eye) => {
      const pupil = eye.querySelector('.pupil');
      const rect = eye.getBoundingClientRect();
      const eyeX = rect.left + rect.width / 2;
      const eyeY = rect.top + rect.height / 2;
      const angle = Math.atan2(event.clientY - eyeY, event.clientX - eyeX);
      const distance = Math.min(rect.width / 4, Math.sqrt(Math.pow(event.clientX - eyeX, 2) + Math.pow(event.clientY - eyeY, 2)) / 10);
      pupil.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    });
  });
</script>

</body>
</html>
